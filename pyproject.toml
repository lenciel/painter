[project]
name = "painter"
version = "0.1.0"
description = "Crawlers that collect paintings from museum open-data endpoints."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
painter = "painter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["painter"]
